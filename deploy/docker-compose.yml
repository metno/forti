services:
  rawdataforecaster:
    image: ${IMAGE_REPO}/rawdataforecaster:${IMAGE_TAG:-latest}
    ports:
      - "5052:5052"
    volumes:
      - ./rawdataforecaster.config.json:/config.json:ro
      - ${FORECAST_DATA_PATH:-../data/forecast}:/data/forecast:ro
    command: ["-config", "/config.json"]
    networks:
      - internal

  correctedforecaster:
    image: ${IMAGE_REPO}/correctedforecaster:${IMAGE_TAG:-latest}
    ports:
      - "5051:5051"
    profiles: ["corrected"]
    volumes:
      - ${TOPOGRAPHY_DATA_PATH:-../data/topography}:/data/topography:ro
    command:
      - "-upstream"
      - "rawdataforecaster:5052"
      - "-workdir"
      - "/data/topography"
    depends_on:
      - rawdataforecaster
    networks:
      - internal

  jsonfrontend:
    image: ${IMAGE_REPO}/jsonfrontend:${IMAGE_TAG:-latest}
    ports:
      - "8080:8080"
    command:
      - "-upstream"
      - "${JSONFRONTEND_UPSTREAM:-rawdataforecaster:5052}"
    depends_on:
      - rawdataforecaster
    networks:
      - internal

networks:
  internal:
